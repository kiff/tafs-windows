name: CI

# Tests are grouped by part. A change runs only the parts it touches, plus strings and contracts.
# The full suite runs nightly, unfiltered, so a test that names no part still runs. One part can be run alone: Actions > CI > Run workflow > part.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      part:
        description: "A part to run alone (for example approvals), or all. Empty: the parts this branch changes."
        required: false
        default: ""
      sign:
        description: "Sign with KIFF's certificate, from the windows-signing environment (main only)."
        type: boolean
        required: false
        default: false
      release:
        description: "A version to make a draft release of, such as 1.0.0 (main only, with no part: the full suite). Empty: none. The owner publishes."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: dotnet build tools/Tafs.Ci -c Release -v q
      - id: parts
        env:
          INPUT_PART: ${{ inputs.part }}
          INPUT_RELEASE: ${{ inputs.release }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ci="dotnet tools/Tafs.Ci/bin/Release/net8.0/Tafs.Ci.dll"
          if [ -n "$INPUT_RELEASE" ]; then
            # A release runs everything, unfiltered, as the nightly run: never one part alone.
            [ -z "$INPUT_PART" ] || { echo "::error::a release runs the full suite: leave part empty"; exit 1; }
            parts=$($ci parts --only all)
          elif [ -n "$INPUT_PART" ]; then
            parts=$($ci parts --only "$INPUT_PART")   # refuses anything but a declared part or all
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            parts=$($ci parts --only all)             # the full suite, unfiltered
          elif [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            parts=$($ci parts --all)
          else
            parts=$($ci parts --base "$BASE_REF")
          fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "Parts to run: $parts"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

  test:
    needs: plan
    if: needs.plan.outputs.parts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
        exclude:
          - part: app # built on Windows by the app job
    name: test (${{ matrix.part }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Words and contracts at the pin
        run: dotnet run --project tools/Tafs.Ci -- sync
      - name: Tests, part ${{ matrix.part }}
        run: dotnet run --project tools/Tafs.Ci -- test "$PART"
        env:
          PART: ${{ matrix.part }}

  # The WinUI app, on Windows, only when it changed (or nightly): it builds, then saves the main
  # screens in en, fr and pt, light and dark, at a laptop's size, for the PR.
  app:
    needs: plan
    if: contains(needs.plan.outputs.parts, '"app"') || contains(needs.plan.outputs.parts, '"all"')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Words and contracts at the pin
        run: dotnet run --project tools/Tafs.Ci -- sync
      - name: No key twice in a resource dictionary
        run: dotnet run --project tools/Tafs.Ci -- xaml-keys
      - name: Build
        run: dotnet build src/Tafs.App -c Release -p:Platform=x64
      # Each screen in en, fr and pt, light and dark. The job fails if any is missing: a crash at launch
      # or a missing word stops the app before it saves.
      - name: Screenshots
        run: |
          exe=src/Tafs.App/bin/x64/Release/net8.0-windows10.0.19041.0/Tafs.App.exe
          mkdir -p screenshots
          missing=0
          for screen in sign-in signed-out overview overview-home overview-labels taf-home taf-setup-home coach-home view-only pair pair-why needs-you record calendar calendar-week usage connect-apps account coach coach-wide taf taf-setup taf-card taf-starts taf-results; do
            case $screen in
              sign-in) opts=(--page sign-in) ;;
              signed-out) opts=(--page signed-out) ;;
              overview) opts=(--sample) ;;
              overview-home) opts=(--home shared/contracts/home.json) ;;
              overview-labels) opts=(--home tests/fixtures/home-labels/home.json) ;;
              taf-home) opts=(--home shared/contracts/home.json --page taf) ;;
              taf-setup-home) opts=(--home shared/contracts/home.json --page taf-setup) ;;
              coach-home) opts=(--home shared/contracts/home.json --page coach) ;;
              view-only) opts=(--view-only) ;;
              pair) opts=(--page pair) ;;
              pair-why) opts=(--page pair-why) ;;
              needs-you) opts=(--page needs-you --sample) ;;
              record) opts=(--page record --sample) ;;
              calendar) opts=(--page calendar --sample) ;;
              calendar-week) opts=(--page calendar-week --sample) ;;
              usage) opts=(--page usage --sample) ;;
              connect-apps) opts=(--page connect-apps --sample) ;;
              account) opts=(--page account --sample) ;;
              coach) opts=(--page coach --sample) ;;
              # "Taking shape" beside the conversation: the contracts, with planque's grants and KIFF's draft beside them.
              coach-wide) python ci/coach-shape.py "$RUNNER_TEMP/coach-shape"; opts=(--home "$RUNNER_TEMP/coach-shape/home.json" --page coach-wide) ;;
              # Setup's Starts when and Results go to: the contracts, with a dial beside them.
              taf-starts|taf-results) mkdir -p "$RUNNER_TEMP/knob"; cp shared/contracts/*.json tests/fixtures/taf-knob/*.json "$RUNNER_TEMP/knob/"; opts=(--home "$RUNNER_TEMP/knob/home.json" --page "$screen") ;;
              taf) opts=(--page taf --sample) ;;
              taf-setup) opts=(--page taf-setup --sample) ;;
              taf-card) opts=(--page taf-card --sample) ;;
            esac
            for lang in en fr pt; do for theme in light dark; do
              file="screenshots/$screen-$lang-$theme.png"
              timeout 120 "$exe" "${opts[@]}" --lang "$lang" --theme "$theme" --screenshot "$file" || true
              if [ ! -s "$file" ]; then echo "::error::no screenshot: $file"; missing=$((missing + 1)); fi
            done; done
          done
          echo "$(ls screenshots | wc -l) screenshots, $missing missing"
          [ "$missing" -eq 0 ]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  # The TPM key's tests need Windows: they're skipped on Linux. Here they run, or say why they can't
  # (a runner with no TPM), whenever pairing or approvals change.
  windows-keys:
    needs: plan
    if: contains(needs.plan.outputs.parts, '"pairing"') || contains(needs.plan.outputs.parts, '"approvals"') || contains(needs.plan.outputs.parts, '"all"')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Words and contracts at the pin
        run: dotnet run --project tools/Tafs.Ci -- sync
      - name: The TPM key and Windows Hello's native calls, on Windows
        run: dotnet test tests/Tafs.Core.Tests -c Release --filter "FullyQualifiedName~TpmKey|FullyQualifiedName~WindowsHello" --logger "console;verbosity=normal"

  # The team's download (docs/install.md): the unpackaged app, self-contained, for x64 and ARM64. Unzip and run: no
  # install, no setting. Kept only from main, the nightly run and on demand, once the tests and the app build passed (a
  # part this run skipped counts as passed). A PR that changes the app only checks that it publishes and starts: a PR from
  # a fork runs its own code, so nothing of it is kept under the download's name.
  zip:
    needs: [plan, test, app]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.app.result == 'success' || needs.app.result == 'skipped')
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(needs.plan.outputs.parts, '"app"') || contains(needs.plan.outputs.parts, '"all"'))
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Words and contracts at the pin
        run: dotnet run --project tools/Tafs.Ci -- sync
      # 0.1.<run>.0, or a release run's <release>.<run> (ci/version.sh).
      - name: This build's version
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || '' }}
          RUN: ${{ github.run_number }}
        run: bash ci/version.sh
      - name: The app, self-contained
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          rid=win-$(echo "$PLATFORM" | tr '[:upper:]' '[:lower:]')
          # The build's version, as the MSIX's, and its commit: a report names the build it came from. No debug symbols.
          dotnet publish src/Tafs.App -c Release -p:Platform="$PLATFORM" -r "$rid" --self-contained -o "artifacts/zip/tafs-$PLATFORM" \
            -p:DebugType=none -p:Version="$VERSION" -p:SourceRevisionId=${{ github.sha }}
          test -f "artifacts/zip/tafs-$PLATFORM/Tafs.App.exe"
      # The x64 build opens its sign-in screen and saves it, or the job fails: a download that doesn't start never ships.
      - name: It starts
        if: matrix.platform == 'x64'
        run: timeout 120 artifacts/zip/tafs-x64/Tafs.App.exe --page sign-in --screenshot zip-start.png && test -s zip-start.png
      # One tafs (Program.cs): a second start, here planque's tafs:// return from a vendor's sign-in, hands its activation to
      # the running window and ends, and the first keeps running.
      - name: One tafs, and tafs:// comes back to it
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/zip/tafs-x64/Tafs.App.exe).Path
          $first = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($first.HasExited) { throw "the first tafs ended: $($first.ExitCode)" }
          $scheme = Get-Item 'HKCU:\Software\Classes\tafs' -ErrorAction SilentlyContinue
          Write-Host ("tafs: registered for this user: " + [bool]$scheme)
          $second = Start-Process $exe -ArgumentList 'tafs://planque/signed-in?tenant=t&grant=g&confirm=c' -PassThru
          if (-not $second.WaitForExit(30000)) { $second.Kill(); Stop-Process -Id $first.Id; throw 'the second start did not hand over and end' }
          Start-Sleep -Seconds 2
          if ($first.HasExited) { throw 'the first tafs ended when the second came' }
          Stop-Process -Id $first.Id
          Write-Host 'one tafs: the second start handed its activation over and ended'
      # The installer people download (docs/install.md): an MSI of this same publish, and the setup .exe around it, by WiX
      # v5 (ci/installer.sh). Built on every run that builds the zip.
      - name: The installer
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash ci/installer.sh tools && bash ci/installer.sh msi && bash ci/installer.sh bundle
      # On x64: the setup installs quietly, tafs starts from where it put it and saves its sign-in screen, and it uninstalls.
      - name: It installs, starts and uninstalls
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./ci/install-check.ps1 -Setup "artifacts/installer/tafs-setup-$env:SETUP_NAME-x64.exe"
      # On x64: the setup's first and last screens in French and German, by the real setup with /lang, installing and
      # uninstalling (ci/setup-screens.ps1). Kept as `setup-screens`. A screen not saved doesn't fail the zip: a picture
      # is for people to read, and the install check above is what gates.
      - name: The setup's screens, in French and German
        if: matrix.platform == 'x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = "artifacts/installer/tafs-setup-$env:SETUP_NAME-x64.exe"
          ./ci/setup-screens.ps1 -Setup $setup -Lang fr -Lcid 1036 -Out setup-screens
          ./ci/setup-screens.ps1 -Setup $setup -Lang de -Lcid 1031 -Out setup-screens
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.platform == 'x64'
        with:
          name: setup-screens
          path: setup-screens/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: tafs-windows-${{ matrix.platform }}
          path: artifacts/zip/tafs-${{ matrix.platform }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: tafs-windows-setup-${{ matrix.platform }}
          path: artifacts/installer/
          if-no-files-found: error

  # A draft release (docs/install.md, Releasing): on demand from main with a version and no part, once every check of this
  # run passed (the full suite, the app, the TPM keys, and the zip's install), none of them skipped. With "sign" ticked,
  # only if signing passed, with the signed setups. Without it, the unsigned setups, named "-UNSIGNED" so kiff.dev's
  # download page (which takes only "*-x64.exe") never serves them even if published, titled and noted "never publish":
  # they're for the owner's install test only. Each setup's SHA-256 is in the notes. A draft never shows on the page; the
  # owner publishes, a signed draft only, once their test of that build passed.
  release:
    needs: [plan, test, app, windows-keys, zip, sign]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.release != '' && inputs.part == ''
      && github.ref == 'refs/heads/main'
      && needs.plan.result == 'success' && needs.test.result == 'success' && needs.app.result == 'success'
      && needs.windows-keys.result == 'success' && needs.zip.result == 'success'
      && (needs.sign.result == 'success' || (!inputs.sign && needs.sign.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - if: inputs.sign
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tafs-windows-signed-setup-*
          path: setup
          merge-multiple: true
      - if: ${{ !inputs.sign }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tafs-windows-setup-*
          path: setup
          merge-multiple: true
      - name: A draft, never published here
        working-directory: setup
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          SIGNED: ${{ inputs.sign }}
        run: |
          [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::a release is three numbers, such as 1.0.0"; exit 1; }
          x64="tafs-setup-$RELEASE-x64.exe"; arm64="tafs-setup-$RELEASE-arm64.exe"
          test -s "$x64" && test -s "$arm64"
          if [ "$SIGNED" = true ]; then
            title="tafs for Windows v$RELEASE"
            note="Signed with KIFF's certificate. A draft until the owner's test of this build passes; the owner publishes it as it is."
          else
            mv "$x64" "tafs-setup-$RELEASE-x64-UNSIGNED.exe"; x64="tafs-setup-$RELEASE-x64-UNSIGNED.exe"
            mv "$arm64" "tafs-setup-$RELEASE-arm64-UNSIGNED.exe"; arm64="tafs-setup-$RELEASE-arm64-UNSIGNED.exe"
            title="tafs for Windows v$RELEASE, UNSIGNED: never publish"
            note="UNSIGNED: never publish this draft. It's for the owner's install test only; only a signed build is published."
          fi
          {
            echo "$note"; echo
            echo "Built by CI run $GITHUB_RUN_NUMBER at $GITHUB_SHA."; echo
            echo "SHA-256:"; echo '```'; sha256sum "$x64" "$arm64"; echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "v$RELEASE" "$x64" "$arm64" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$title" --notes-file "$RUNNER_TEMP/notes.md"

  # The MSIX (docs/install.md), kept for the day it's signed: Windows installs no unsigned package that holds an app.
  # x64 and ARM64, from main and on demand only until then. Each build's version is 0.1.<run number>.0.
  msix:
    needs: plan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Words and contracts at the pin
        run: dotnet run --project tools/Tafs.Ci -- sync
      - name: This build's version
        run: sed -i "s/Version=\"0.1.0.0\"/Version=\"0.1.${{ github.run_number }}.0\"/" src/Tafs.App/Package.appxmanifest
      - name: MSIX, unsigned
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          rid=win-$(echo "$PLATFORM" | tr '[:upper:]' '[:lower:]')
          dotnet build src/Tafs.App -c Release -p:Platform="$PLATFORM" -p:RuntimeIdentifier="$rid" -p:TafsMsix=true
          ls artifacts/msix/*/*.msix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tafs-msix-${{ matrix.platform }}
          path: artifacts/msix/*/*.msix
          if-no-files-found: error

  # Signing's dry run (docs/install.md, rule 16), on main and on demand, with no environment: the app's own files signed
  # with a throwaway self-signed certificate made in the run (ci/sign-dry-run.ps1), then read back by the same check the
  # real signing uses (ci/check-signatures.ps1, its subject compared exactly). It proves the file list, signtool and the
  # check, and keeps nothing.
  sign-dry-run:
    needs: [zip]
    if: >-
      always() && needs.zip.result == 'success'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tafs-windows-${{ matrix.platform }}
          path: artifacts/zip/tafs-${{ matrix.platform }}
      - name: Dry run
        shell: pwsh
        run: ./ci/sign-dry-run.ps1 -Folder "artifacts/zip/tafs-${{ matrix.platform }}"

  # Signing for real (docs/install.md): only on demand from main, with "sign" ticked, so a main push never waits on the
  # windows-signing environment's protection rules (the owner's; no session approves a deployment). The job signs in to
  # Azure by OIDC, as the environment's federated credential, with no client secret; id-token is written here only.
  # Azure's own action then signs with KIFF's Artifact Signing certificate, in order: the app's own files, the MSI built
  # from them, the setup's engine, and the setup around it (ci/installer.sh). Each signature must be Valid and by
  # WINDOWS_SIGNING_SUBJECT, the certificate's full subject, exactly; the signed x64 setup must install, start and
  # uninstall. Any value missing fails the run, saying which; nothing is signed with half of them.
  sign:
    needs: [zip]
    if: >-
      always() && needs.zip.result == 'success'
      && github.event_name == 'workflow_dispatch' && inputs.sign && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
      SIGNING_TENANT: ${{ vars.AZURE_TENANT_ID }}
      SIGNING_CLIENT: ${{ vars.AZURE_CLIENT_ID }}
      SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
    steps:
      - name: Signing's values
        run: |
          missing=""
          for name in TENANT CLIENT ENDPOINT ACCOUNT PROFILE SUBJECT; do
            var="SIGNING_$name"
            [ -n "${!var}" ] || case $name in TENANT|CLIENT) missing="$missing AZURE_${name}_ID" ;; *) missing="$missing WINDOWS_SIGNING_$name" ;; esac
          done
          if [ -n "$missing" ]; then echo "::error::windows-signing is missing the variables:$missing"; exit 1; fi
      # Nothing here pushes, so the checkout keeps no token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tafs-windows-${{ matrix.platform }}
          path: artifacts/zip/tafs-${{ matrix.platform }}
      # The zip job's version, so the signed MSI and setup are named and numbered as its unsigned ones.
      - name: This build's version
        env:
          RELEASE: ${{ inputs.release }}
          RUN: ${{ github.run_number }}
        run: bash ci/version.sh
      # Everything downloaded comes before the sign-in, so no fetch runs while the signing identity is live.
      - name: WiX and its extension, before signing in
        run: bash ci/installer.sh tools
      - name: Signed in to Azure, by OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.SIGNING_CLIENT }}
          tenant-id: ${{ env.SIGNING_TENANT }}
          allow-no-subscriptions: true
      - name: The app's own files, signed
        uses: ./.github/actions/sign
        with:
          files: |
            ${{ github.workspace }}\artifacts\zip\tafs-${{ matrix.platform }}\Tafs.App.exe
            ${{ github.workspace }}\artifacts\zip\tafs-${{ matrix.platform }}\Tafs.App.dll
            ${{ github.workspace }}\artifacts\zip\tafs-${{ matrix.platform }}\Tafs.Core.dll
      - name: Each of the app's signatures is KIFF's
        shell: pwsh
        run: ./ci/check-signatures.ps1 -Folder "artifacts/zip/tafs-$env:PLATFORM" -Subject $env:SIGNING_SUBJECT
      - name: The MSI, of the signed files
        run: bash ci/installer.sh msi
      - name: The MSI, signed
        uses: ./.github/actions/sign
        with:
          files: ${{ github.workspace }}\artifacts\installer\tafs-${{ env.VERSION }}-${{ matrix.platform == 'x64' && 'x64' || 'arm64' }}.msi
      - name: The setup, and its engine out to be signed
        run: bash ci/installer.sh bundle && bash ci/installer.sh detach
      - name: The setup's engine, signed
        uses: ./.github/actions/sign
        with:
          files: ${{ github.workspace }}\artifacts\installer\engine-${{ matrix.platform == 'x64' && 'x64' || 'arm64' }}.exe
      - name: The engine's signature is KIFF's
        shell: pwsh
        run: ./ci/check-signatures.ps1 -Folder artifacts/installer -Files "engine-$($env:PLATFORM.ToLower()).exe" -Subject $env:SIGNING_SUBJECT
      - name: The signed engine back in the setup
        run: bash ci/installer.sh reattach
      - name: The setup, signed
        uses: ./.github/actions/sign
        with:
          files: ${{ github.workspace }}\artifacts\installer\tafs-setup-${{ env.SETUP_NAME }}-${{ matrix.platform == 'x64' && 'x64' || 'arm64' }}.exe
      - name: The MSI's and the setup's signatures are KIFF's
        shell: pwsh
        run: |
          $arch = $env:PLATFORM.ToLower()
          ./ci/check-signatures.ps1 -Folder artifacts/installer -Subject $env:SIGNING_SUBJECT `
            -Files "tafs-$env:VERSION-$arch.msi", "tafs-setup-$env:SETUP_NAME-$arch.exe"
      - name: The signed setup installs, starts and uninstalls
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./ci/install-check.ps1 -Setup "artifacts/installer/tafs-setup-$env:SETUP_NAME-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tafs-windows-signed-${{ matrix.platform }}
          path: artifacts/zip/tafs-${{ matrix.platform }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tafs-windows-signed-setup-${{ matrix.platform }}
          path: artifacts/installer/
          if-no-files-found: error

  # Fails when the pin is more than 7 days or 20 commits behind the shared repository's main.
  pin-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: dotnet run --project tools/Tafs.Ci -- drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
