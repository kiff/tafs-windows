name: Public text (pull request)

# This repo is public, and so is what's said on its pull requests. A pull request's title, its body and each review say
# what changed, why and how it was checked, never who decided it or where (tests/Tafs.Core.Tests/Ci/PublicTextTests.cs).
# The text reaches the test only as the API returns it, through a shell variable, never inside a run line, so nothing in it
# can run as a command. The test is
# the base branch's own copy, so a pull request can't change the rule it's checked by.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  # To read the pull request and the review as they read now, never write.
  pull-requests: read

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./.github/actions/setup
      - name: Words and contracts at the pin
        run: dotnet run --project tools/Tafs.Ci -- sync
      - name: Build the tests
        run: dotnet build tests/Tafs.Core.Tests -c Release -v q
      # Each is read as it is now, not as the event first carried it: a re-run then checks the text after an edit, and an
      # edit plus a re-run clears a failure. The read is its own assignment under `bash -e`, so a read that fails fails the check.
      - name: The pull request's title and body, as they read now
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          TAFS_PUBLIC_TEXT="$(gh api "repos/$REPO/pulls/$PR" --jq '.title + "\n" + (.body // "")')"
          export TAFS_PUBLIC_TEXT
          dotnet test tests/Tafs.Core.Tests -c Release --no-build --filter "FullyQualifiedName~PublicTextTests.A_pull_requests_text_names_no"
      - name: The review's body, as it reads now
        if: github.event_name == 'pull_request_review'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW: ${{ github.event.review.id }}
        run: |
          TAFS_PUBLIC_TEXT="$(gh api "repos/$REPO/pulls/$PR/reviews/$REVIEW" --jq '.body // ""')"
          export TAFS_PUBLIC_TEXT
          dotnet test tests/Tafs.Core.Tests -c Release --no-build --filter "FullyQualifiedName~PublicTextTests.A_pull_requests_text_names_no"
